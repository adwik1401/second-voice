<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Second Voice cover</title>
    <style>
      html, body { margin: 0; }
      body { width: 1600px; height: 900px; overflow: hidden; position: relative; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #fff;
             background: radial-gradient(1200px 700px at 85% 30%, #1d6b80 0%, #0f4c5c 45%, #0a2a35 100%); }
      .left { position: absolute; left: 96px; top: 150px; width: 720px; }
      .tag { display: inline-block; letter-spacing: 0.22em; font-size: 22px; font-weight: 700; color: #e09f3e; margin-bottom: 26px; }
      h1 { font-size: 68px; line-height: 1.05; margin: 0 0 30px; font-weight: 800; letter-spacing: -0.02em; }
      h1 em { font-style: normal; color: #ffb74d; }
      p { font-size: 29px; line-height: 1.4; margin: 0 0 40px; color: #cfe3ea; max-width: 640px; }
      .chips { display: flex; gap: 14px; flex-wrap: wrap; }
      .chip { border: 2px solid #ffffff55; border-radius: 999px; padding: 10px 22px; font-size: 22px; background: #ffffff14; }
      .shot { position: absolute; right: -110px; top: 130px; width: 860px; border-radius: 18px; box-shadow: 0 40px 90px #000a, 0 0 0 2px #ffffff22; transform: rotate(-3deg); }
      .foot { position: absolute; left: 96px; bottom: 56px; font-size: 22px; color: #9fc3cf; }
    </style>
  </head>
  <body>
    <div class="left">
      <div class="tag">SECOND VOICE</div>
      <h1>Scammers coach their victims.<br /><em>We hear the coach.</em></h1>
      <p>A scam-interrupt voice agent for UK banks. It catches the second voice at the moment of payment.</p>
      <div class="chips">
        <span class="chip">AssemblyAI Voice Agent API</span>
        <span class="chip">Realtime Speech-to-Text</span>
      </div>
    </div>
    <img class="shot" src="images/officer-view.png" alt="" />
    <div class="foot">AssemblyAI × lablab.ai Voice Agent Hackathon · Fictional bank, fictional data</div>
  </body>
</html>
