<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spike clips</title>
    <style>
      body { font: 18px system-ui, sans-serif; margin: 16px; }
      h1 { font-size: 20px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0; }
      button { font-size: 18px; padding: 18px 8px; border-radius: 10px; border: 1px solid #888; background: #f4f4f4; }
      button:active { background: #ccc; }
      .benign button { background: #e8f5e9; }
      p { color: #555; margin: 4px 0; }
    </style>
  </head>
  <body>
    <h1>Phase 0 — whisper clips</h1>
    <p>Phone ~1.5 m from the laptop. Set the phone volume once (~50%) and leave it.</p>

    <h2>Coaching (should be flagged)</h2>
    <div class="row"><button data-clip="coach-1-quiet">1 · quiet</button><button data-clip="coach-1-normal">1 · normal</button></div>
    <div class="row"><button data-clip="coach-2-quiet">2 · quiet</button><button data-clip="coach-2-normal">2 · normal</button></div>
    <div class="row"><button data-clip="coach-3-quiet">3 · quiet</button><button data-clip="coach-3-normal">3 · normal</button></div>

    <h2>Benign chatter (must NOT be flagged)</h2>
    <div class="row benign"><button data-clip="benign-1-quiet">kettle · quiet</button><button data-clip="benign-1-normal">kettle · normal</button></div>

    <script>
      // One shared player so a tap always restarts cleanly.
      const player = new Audio();
      document.querySelectorAll('button[data-clip]').forEach((b) => {
        b.addEventListener('click', () => {
          player.src = b.dataset.clip + '.wav';
          player.currentTime = 0;
          void player.play();
        });
      });
    </script>
  </body>
</html>
